name: snapshot-mg
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snapshot_mg.py > data/tse/mg_log.txt 2>&1 || true
      - run: |
          git config user.name "robo-tse" && git config user.email "robo@users.noreply.github.com"
          git add data/tse/mg_* && git commit -m "Snapshot MG: 1º turno por candidato e mesorregiões IBGE" && git pull --rebase && git push
