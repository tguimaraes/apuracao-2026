name: snapshot-tse
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa resultado nacional e por estado (1º e 2º turno)
        run: |
          mkdir -p data/tse
          for ele in 6257 6258; do
            for uf in br ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to zz; do
              curl -sS -f -A "Mozilla/5.0" "https://resultados.tse.jus.br/oficial/ele2026/$ele/dados/$uf/$uf-c0001-e00$ele-u.json" -o "data/tse/$uf-$ele.json" || echo "falhou $uf $ele"
            done
          done
          date -u > data/tse/_quando.txt
      - run: |
          git config user.name "robo-tse" && git config user.email "robo@users.noreply.github.com"
          git add data/tse && git commit -m "Snapshot TSE $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push
