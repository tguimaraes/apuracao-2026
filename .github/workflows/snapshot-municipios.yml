name: snapshot-municipios
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snapshot_municipios.py
      - run: |
          git config user.name "robo-tse" && git config user.email "robo@users.noreply.github.com"
          git add data/tse/municipios.csv && git commit -m "Snapshot municipal TSE $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push
